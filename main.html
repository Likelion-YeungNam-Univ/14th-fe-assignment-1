<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FE 1주차 과제</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  </head>
  <body class ="Background">
    <div class="Container">
      <div class="Welcome_Content">
        <div class="img_Container">
          <img src="YU_LikeLion.png" style="width:80px;margin:20px;" alt="Likelion_img" />
          <div class="header_text">
            <p>영남대학교</p>
            <p>멋쟁이사자처럼</p>
            <p>14기</p>
          </div>
        </div>
        <div class="Welcome_text">
          <div class="Wel_1st">
            <p style="color:white;">여러분을 진심으로 환영합니다</p>
          </div>
          <p style="color:white;">멋쟁이사자처럼은 성장 의지를 가진 사람들을 돕기 위해 존재합니다. 
            그리고 이들을 돕기 위한 가장 근본적이고 효과적인 방법은 교육이라고 생각합니다!
          </p>
        </div>
        <div class="Dp">
          <button class="P&D">
            <span style="color:black;font-size:22px;font-weight:800;" >P&D</span>
          </button>
          <button class="FE">
            <span style="color:black;font-size:22px;font-weight:800;" >FE</span>
          </button>
          <button class="BE">
            <span style="color:black;font-size:22px;font-weight:800;" >BE</span>
          </button>
        </div>
      </div>
      <div class="Login_Window">
        <span style="color : white;font-style : italic; font-size : 17px;margin-top:20px;font-weight : bold;">LOGIN</span>
        <div class ="Login_content">
          <div class="id_input">
            <span class="material-symbols-outlined">person</span>
            <input type="text" name="아이디" placeholder="username"></input>
          </div>
          <div class ="pw_input">
            <span class="material-symbols-outlined">lock</span>
            <input type="password" name="비밀번호" placeholder="password"></input>
          </div>
        </div>
        <div>
          <button class="Login_Button">
            <span class="Login_text" style=" color: white;">로그인</span>
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
