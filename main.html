<!DOCTYPE html>
<html lang="en">
  <head> <meta charset="UTF-8" />
    <title>FE 1주차 과제</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="main-box">
        <div class="left">
          <div class="top-group">
            <img src="YU_LikeLion.png" alt="영남대학교 멋쟁이사자처럼 로고" class="logo" />

            <div class="title_text">
              <h1>영남대학교</h1>
              <h1>멋쟁이사자처럼</h1>
              <h1>14기</h1>
            </div>
          </div>

          <p class="welcome_text">여러분을 진심으로 환영합니다!</p>

          <p class="description">
            멋쟁이사자처럼은 성장 의지를 가진 사람들을 돕기 위해 존재합니다.
            그리고 이들을 돕기 위한 가장 근본적이고 효과적인 방법은 교육이라고
            생각합니다!
          </p>

          <div class="part-boxes">
            <div class="box1">P&amp;D</div>
            <div class="box1">FE</div>
            <div class="box2">BE</div>
          </div>
        </div>

        <div class="right">
          <div class="login-box">
            <h2>LOGIN</h2>

            <form class="login-form">
              <div class="input-box">
                <i class="fa-solid fa-user"></i>
                <input type="text" name="username" placeholder="username" />
              </div>

              <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input
                  type="password"
                  name="password"
                  placeholder="password"
                />
              </div>

              <button type="submit" class="login-btn">로그인</button>
            </form>
          </div>
        </div>
      </div>
    </div>
    
  </body>
</html>

        <div class="right-section">
            <div class="login-card">
                <h2>LOGIN</h2>
                
                <div class="input-group">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" placeholder="username">
                </div>
                
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" placeholder="password">
                </div>

                <button class="login-btn">로그인</button>
            </div>
        </div>

    </div>

</body>
</html>
