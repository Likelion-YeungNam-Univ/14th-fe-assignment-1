<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FE 1주차 과제</title>
    <link rel = "stylesheet" href = "style.css" />
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  </head>
  <body>
    <div class="container">
      <div class="section">
        <div class="header">
          <img src="YU_LikeLion.png" style="width: 150px" alt = "영남대멋사로고" />
          <div class="title">
            <p>영남대학교</p>
            <p>멋쟁이사자처럼</p>
            <p>14기</p>
          </div> 
        </div>

        <p style="color: lightgray;">여러분을 진심으로 환영합니다!</p>
        <p style="color: lightgray;"> 멋쟁이사자처럼은 성장 의지를 가진 사람들을 돕기 위해 존재합니다. 그리고 이들을 돕기 위한 가장 근본적이고 효과적인 방법은 교육이라고 생각합니다!</p>

        <div class = "part">
          <div class="box">P&D</div>
          <div class="box">FE</div>
          <div class="box">BE</div>
        </div>
      </div>

      <div class = "login">
        <h1 style="color: white;">LOGIN</h1>
        <div class="input-box">
          <div class="ID">
            <i class="bx bxs-user"></i>
            <input type="text" name="username" placeholder="username" />
          </div>
          <div class="PW">
            <i class="bx bxs-lock-alt"></i>
            <input type="password" name="password" placeholder="password" />
          </div>
        </div>
        <button type="submit">로그인</button>
      </div>
    </div>
  </body>
</html>
