<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FE 1주차 과제</title>
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <div class="container">
      <div class="left-section">
        <div class="left-box-text">
          <img src="YU_LikeLion.png" alt="이미지 없음">
          <h2>영남대학교<br>멋쟁이사자처럼<br>14기</h2>
        </div>

        <div class="left-intro-text">
          <p class="intro">여러분을 진심으로 환영합니다!</p>
          <p class="description">
            멋쟁이사자처럼은 성장의지를 가진 사람들을 돕기 위해 존재합니다.
            그리고 이들을 돕기 위한 가장 근본적이고 효과적인 방법은 교육이라고 생각합니다!
          </p>
        </div>

        <!-- name="track"로 3개의 라디오 버튼이 그룹으로-->
        <!-- id와 for 짝꿍 맺어야 함.-->
        <div class="track">
          <input type="radio" id="pnd" name="track" value="P&D">
          <label for="pnd" class="radio-btn">P&D</label>

          <input type="radio" id="fe" name="track" value="FE">
          <label for="fe" class="radio-btn">FE</label>

          <input type="radio" id="be" name="track" value="BE">
          <label for="be" class="radio-btn">BE</label>
        </div>
      </div>

      <div class="right-section">
        <div class="login-section">
          <h2 class ="login-title">LOGIN</h2>
          <form class="login-form"> 
            <input type="text" name="username" placeholder="username">
            <input type="password" name="password" placeholder="password">
            <button type="submit" class="submit-btn">로그인</button>
          </form>
        </div>
      </div>
    </div>

  </body>
</html>

<!-- 자유로운 방식으로 구현하시면 되며, .github 폴더는 신경쓰지 않으셔도 됩니다. -->
